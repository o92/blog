# Scrum 领域术语（流程笔记）

Scrum:
  summary: "用固定节奏的 Sprint，把 Backlog 做成可用 Increment 的轻量框架"
  source: "scrum/_index.md"

Scrum Team:
  summary: "PO + Scrum Master + Developers；跨职能、自我管理"
  source: "scrum/01-roles.md"

Scrum Master:
  summary: "建立 Scrum、提升团队有效性；辅导、清障、促成事件"
  source: "scrum/01-roles.md#角色速查"

Product Owner:
  summary: "最大化产品价值；对 Product Goal 与 Backlog 排序负责"
  source: "scrum/01-roles.md#角色速查"

Developers:
  summary: "每个 Sprint 交付可用 Increment；自定如何完成工作"
  source: "scrum/01-roles.md#角色速查"

Sprint:
  summary: "固定长度（≤1 月）的容器；内含 Planning / Daily / Review / Retro"
  source: "scrum/03-events.md"

Sprint Planning:
  summary: "启动 Sprint：定 Sprint Goal、选条目、做计划 → 产出 Sprint Backlog"
  source: "scrum/03-events.md#1. Sprint Planning"

Daily Scrum:
  summary: "Developers 每天 15 分钟：对齐 Sprint Goal，产出当日计划"
  source: "scrum/03-events.md#2. Daily Scrum"

Sprint Review:
  summary: "Team + 干系人检视 Increment，调整下一步与 Backlog"
  source: "scrum/03-events.md#3. Sprint Review"

Sprint Retrospective:
  summary: "Team 复盘并产出改进项；结束本 Sprint"
  source: "scrum/03-events.md#4. Sprint Retrospective"

Product Backlog:
  summary: "改进产品所需事项的有序清单；团队工作的唯一来源"
  source: "scrum/04-artifacts.md#对照表"

Sprint Backlog:
  summary: "Sprint Goal + 选中条目 + 交付计划；Developers 的实时计划"
  source: "scrum/04-artifacts.md#对照表"

Increment:
  summary: "满足 DoD 的可用增量；朝向 Product Goal 的踏脚石"
  source: "scrum/04-artifacts.md#对照表"

Product Goal:
  summary: "产品未来状态；Product Backlog 的承诺，一次一个"
  source: "scrum/04-artifacts.md#对照表"

Sprint Goal:
  summary: "本 Sprint 的单一目标；Sprint Backlog 的承诺"
  source: "scrum/04-artifacts.md#对照表"

Definition of Done:
  summary: "Increment 质量完成标准；未满足则不可发布/当完成品展示"
  source: "scrum/04-artifacts.md#质量闸门：Definition of Done"
