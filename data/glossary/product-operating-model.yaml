# 产品运作模型术语（Marty Cagan《Transformed》）

Product Operating Model:
  summary: "产品运作模型：强产品公司基于第一性原理的运作方式，非单一流程"
  source: "product-operating-model/01-introduction/01-terms.md#Product Operating Model"
  aliases: ["产品运作模型", "Product Model", "产品模型"]

Prior Model:
  summary: "先前模型：转型前的运作方式（IT/项目/功能团队等）"
  source: "product-operating-model/01-introduction/01-terms.md#Prior Model"
  aliases: ["先前模型"]

Stakeholder:
  summary: "干系人：销售/财务/业务线等内部相关方；协作提供约束，而非单向下达功能清单"
  source: "product-operating-model/01-introduction/01-terms.md#Stakeholder"
  aliases: ["干系人", "stakeholders"]

IT Model:
  summary: "IT 模型：业务点菜、技术接单的成本中心式运作"
  source: "product-operating-model/01-introduction/01-terms.md#IT Model"
  aliases: ["IT 模型"]

Project Model:
  summary: "项目模型：按项目拨款组队结项，知识易流失、技术债高发"
  source: "product-operating-model/01-introduction/01-terms.md#Project Model"
  aliases: ["项目模型"]

Feature Factory:
  summary: "功能工厂：很会交付功能，但看不到客户价值与业务结果"
  source: "product-operating-model/01-introduction/01-terms.md#Feature Factory"
  aliases: ["功能工厂"]

Changing How You Build:
  summary: "改变如何构建：项目→持续产品；小步频繁可靠发布"
  source: "product-operating-model/02-transformation-defined/01-terms.md#Changing How You Build"
  aliases: ["改变如何构建"]

Changing How You Solve Problems:
  summary: "改变如何解题：功能清单→赋能团队发现有价值的解"
  source: "product-operating-model/02-transformation-defined/01-terms.md#Changing How You Solve Problems"
  aliases: ["改变如何解题"]

Changing How You Decide Which Problems to Solve:
  summary: "改变如何选题：干系人堆需求→愿景与洞察驱动策略"
  source: "product-operating-model/02-transformation-defined/01-terms.md#Changing How You Decide Which Problems to Solve"
  aliases: ["改变如何选题"]

Empowered Product Team:
  summary: "赋能产品团队：拿问题与期望结果，自己发现有价值且对公司可行的解"
  source: "product-operating-model/02-transformation-defined/01-terms.md#Empowered Product Team"
  aliases: ["赋能产品团队", "赋能团队"]

Feature Team:
  summary: "功能团队：接干系人功能清单施工，只对做没做完负责，不对业务结果负责"
  source: "product-operating-model/02-transformation-defined/01-terms.md#Feature Team"
  aliases: ["功能团队"]

Orphaned Feature:
  summary: "孤儿功能：已上线却几乎无价值，也无人再迭代或下线的功能"
  source: "product-operating-model/02-transformation-defined/01-terms.md#Orphaned Feature"
  aliases: ["孤儿功能"]

Product Discovery:
  summary: "产品发现：用原型等低成本方式快速验证，找到值得构建的方案"
  source: "product-operating-model/02-transformation-defined/01-terms.md#Product Discovery"
  aliases: ["产品发现"]

Time to Money:
  summary: "出结果时间：从动手到达成必要业务结果要多久"
  source: "product-operating-model/02-transformation-defined/01-terms.md#Time to Money"
  aliases: ["出结果时间", "达成结果的时间"]

Time to Market:
  summary: "上市时间：多快把东西发出去；不管有没有业务结果就会变成功能工厂"
  source: "product-operating-model/02-transformation-defined/01-terms.md#Time to Market"
  aliases: ["上市时间", "上线时间"]

Fake Agile:
  summary: "假敏捷：仪式齐全但无小步可靠发布之实"
  source: "product-operating-model/02-transformation-defined/01-terms.md#Fake Agile"
  aliases: ["假敏捷"]

Big-Bang Release:
  summary: "大爆炸发布：大量变更捆成一次上线，难测难回滚"
  source: "product-operating-model/02-transformation-defined/01-terms.md#Big-Bang Release"
  aliases: ["大爆炸发布", "大爆炸"]

Enabling Technology:
  summary: "使能技术：让方案刚刚变得可能的技术能力；工程师最易从中看到新解"
  source: "product-operating-model/02-transformation-defined/01-terms.md#Enabling Technology"
  aliases: ["使能技术"]

Product Manager:
  summary: "产品经理：承担价值与商业可行性风险，对业务结果问责"
  source: "product-operating-model/03-competencies/01-terms.md#Product Manager"
  aliases: ["产品经理", "PM"]

Business Analyst:
  summary: "业务分析师：整理需求与规格；角色窄于产品模型里的 Product Manager"
  source: "product-operating-model/03-competencies/01-terms.md#Business Analyst"
  aliases: ["业务分析师", "BA"]

Product Owner:
  summary: "Product Owner：Agile/Scrum 常见角色，多侧重待办与交付，通常达不到赋能团队 Product Manager 标尺"
  source: "product-operating-model/03-competencies/01-terms.md#Product Owner"
  aliases: ["PO"]

Project Manager:
  summary: "项目经理：管范围进度资源交付，不对产品价值与业务结果问责"
  source: "product-operating-model/03-competencies/01-terms.md#Project Manager"
  aliases: ["项目经理", "Program Manager"]

Product Designer:
  summary: "产品设计师：承担可用性与整段体验，参与发现"
  source: "product-operating-model/03-competencies/01-terms.md#Product Designer"
  aliases: ["产品设计师"]

Tech Lead:
  summary: "技术负责人：承担技术可行性与交付，保障小步可靠发布"
  source: "product-operating-model/03-competencies/01-terms.md#Tech Lead"
  aliases: ["技术负责人"]

Product Leaders:
  summary: "产品领导者：产品/设计/工程管理者，辅导带教并给战略上下文"
  source: "product-operating-model/03-competencies/01-terms.md#Product Leaders"
  aliases: ["产品领导者", "产品领导"]

Product Triad:
  summary: "产品铁三角：Product Manager + Product Designer + Tech Lead，缺一难对结果问责"
  source: "product-operating-model/03-competencies/01-terms.md#Product Triad / Troika"
  aliases: ["产品铁三角", "铁三角", "Troika"]

Outcomes over Output:
  summary: "结果重于产出：为业务与客户结果负责，而非功能件数"
  source: "product-operating-model/04-concepts/01-terms.md#Outcomes over Output"
  aliases: ["结果重于产出"]

Output:
  summary: "产出：功能数、是否按时交付等交付物本身"
  source: "product-operating-model/04-concepts/01-terms.md#Output"
  aliases: ["产出"]

Outcome:
  summary: "结果：客户与业务是否真的变好（转化、收入、降本等）"
  source: "product-operating-model/04-concepts/01-terms.md#Outcome"
  aliases: ["业务结果", "outcomes"]

Product Vision:
  summary: "产品愿景：客户中心的未来图景"
  source: "product-operating-model/04-concepts/01-terms.md#Product Vision"
  aliases: ["产品愿景"]

Team Topology:
  summary: "团队拓扑：各产品团队负责什么、边界与彼此依赖如何切分"
  source: "product-operating-model/01-introduction/01-terms.md#Team Topology"
  aliases: ["团队拓扑"]

Product Strategy:
  summary: "产品策略：洞察驱动、有焦点的透明赌注"
  source: "product-operating-model/04-concepts/01-terms.md#Product Strategy"
  aliases: ["产品策略"]

Placing Bets:
  summary: "下策略赌注：把策略当成可调整的投资判断而非假确定性"
  source: "product-operating-model/04-concepts/01-terms.md#Placing Bets"
  aliases: ["下策略赌注", "策略赌注", "赌注"]

Product Culture:
  summary: "产品文化：原则/信任/创新/学习优先于流程控制与虚假可预测"
  source: "product-operating-model/04-concepts/01-terms.md#Product Culture"
  aliases: ["产品文化"]

Product Teams:
  summary: "产品团队：赋能、跨职能的基本单位；拿问题与结果而非功能清单"
  source: "product-operating-model/04-concepts/01-terms.md#Product Teams"
  aliases: ["产品团队"]

Value Risk:
  summary: "价值风险：做出来客户不觉得够好，不愿买/换"
  source: "product-operating-model/04-concepts/01-terms.md#Value Risk"
  aliases: ["价值风险", "value"]

Usability Risk:
  summary: "可用性风险：用户搞不懂或学不会"
  source: "product-operating-model/04-concepts/01-terms.md#Usability Risk"
  aliases: ["可用性风险", "usability"]

Feasibility Risk:
  summary: "技术可行性风险：技能/时间/技术做不出或运维不起"
  source: "product-operating-model/04-concepts/01-terms.md#Feasibility Risk"
  aliases: ["技术可行性风险", "可行性风险", "feasibility"]

Viability Risk:
  summary: "商业可行性风险：合规/销售/成本等约束下公司经营不起"
  source: "product-operating-model/04-concepts/01-terms.md#Viability Risk"
  aliases: ["商业可行性风险", "viability"]

Product Delivery:
  summary: "产品交付：可靠构建并发布；小步发布、自动化、监控与回滚"
  source: "product-operating-model/04-concepts/01-terms.md#Product Delivery"
  aliases: ["产品交付", "delivery"]

Instrumentation:
  summary: "埋点：发布时带遥测，否则无法验证结果"
  source: "product-operating-model/04-concepts/01-terms.md#Instrumentation"
  aliases: ["埋点"]

Uncoupled Releases:
  summary: "解耦发布：团队可独立小步上线，不绑大爆炸火车"
  source: "product-operating-model/04-concepts/01-terms.md#Uncoupled Releases"
  aliases: ["解耦发布"]

Customer Discovery Program:
  summary: "客户发现计划：与参考客户验证问题与方案的机制"
  source: "product-operating-model/05-in-action/01-terms.md#Customer Discovery Program"
  aliases: ["客户发现计划"]

Go-to-Market:
  summary: "上市：包装、定价、销售与信息传递的整体安排"
  source: "product-operating-model/05-in-action/01-terms.md#Go-to-Market"
  aliases: ["上市", "GTM"]

Stakeholder Collaboration:
  summary: "干系人协作：用问题与约束共建，而非单向下达需求"
  source: "product-operating-model/05-in-action/01-terms.md#Stakeholder Collaboration"
  aliases: ["干系人协作"]

Transformation Outcome:
  summary: "转型结果：转型后能做到的、以前做不到的能力与业务结果"
  source: "product-operating-model/06-techniques/01-terms.md#Transformation Outcome"
  aliases: ["转型结果"]

Transformation Assessment:
  summary: "转型评估：对能力与概念落地的诚实盘点"
  source: "product-operating-model/06-techniques/01-terms.md#Transformation Assessment"
  aliases: ["转型评估"]

Pilot Teams:
  summary: "试点团队：先在少数团队验证产品模型再扩展"
  source: "product-operating-model/06-techniques/01-terms.md#Pilot Teams"
  aliases: ["试点团队"]

Product Coach:
  summary: "产品教练：帮助建立产品模型能力的内外部教练"
  source: "product-operating-model/06-techniques/01-terms.md#Product Coach"
  aliases: ["产品教练"]

Product Delivery Coach:
  summary: "交付教练：教测试/发布自动化与 CI/CD，把小步可靠发布做起来"
  source: "product-operating-model/06-techniques/01-terms.md#Product Delivery Coach"
  aliases: ["交付教练"]

Objection Handling:
  summary: "异议应对：按角色回应转型中的典型反对意见"
  source: "product-operating-model/07-objections/01-terms.md#Objection Handling"
  aliases: ["异议应对"]

Finance:
  summary: "财务：预算与投资核算职能；产品模型重谈按团队与业务结果资助"
  source: "product-operating-model/07-objections/01-terms.md#Finance"
  aliases: ["财务"]

People Operations:
  summary: "人事 / 人才运营：职级考核与发展路径；按产品能力重写期望"
  source: "product-operating-model/07-objections/01-terms.md#People Operations"
  aliases: ["人事", "人才运营", "Human Resources", "People Ops"]

Chief Information Officer:
  summary: "首席信息官：传统掌管企业信息技术的高管；需从成本中心转向产品工程共建"
  source: "product-operating-model/07-objections/01-terms.md#Chief Information Officer"
  aliases: ["首席信息官"]

Program Management Office:
  summary: "项目集管理办公室：旧式命令控制派工中枢；宜转向服务团队的交付管理"
  source: "product-operating-model/07-objections/01-terms.md#Program Management Office"
  aliases: ["项目集管理办公室"]

Return on Investment:
  summary: "投资回报：投入相对收益；产品模型更看组合赌注与业务结果"
  source: "product-operating-model/07-objections/01-terms.md#Return on Investment"
  aliases: ["投资回报"]

Innovation Story:
  summary: "创新故事：展示发现与交付如何带来业务结果的短案例"
  source: "product-operating-model/08-stories/01-terms.md#Innovation Story"
  aliases: ["创新故事"]

Transformation Story:
  summary: "转型故事：组织迁往产品运作模型的长篇叙事"
  source: "product-operating-model/08-stories/01-terms.md#Transformation Story"
  aliases: ["转型故事"]

Keys to Successful Transformation:
  summary: "成功转型十要：CEO、技术角色、领导力、真PM等关键条件"
  source: "product-operating-model/09-conclusion/01-terms.md#Keys to Successful Transformation"
  aliases: ["成功转型关键点"]
