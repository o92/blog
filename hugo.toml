# 本地默认；GitHub Pages 由 CI 的 HUGO_BASEURL 覆盖为 https://o92.github.io/blog/
baseURL = 'http://localhost:1313/'
title = '首页'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
locale = 'zh-cn'

# 分类导航用 data/nav.yaml，不需要 Hugo 内置 taxonomy / sitemap
disableKinds = ['taxonomy', 'term', 'sitemap']

[params.author]
name = '胡'
github = 'https://github.com/o92'
email = 'huyuanjing1998@icloud.com'

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[outputs]
home = ['HTML']
section = ['HTML']
page = ['HTML']
