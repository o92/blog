{{ define "body-class" }}layout-simple{{ end }}
{{ define "main" }}
<main class="page-shell page-shell--simple">
  <div class="content-panel">
    <header class="content-header">
      <h1>{{ .Title }}</h1>
    </header>
    {{ with .Content }}
    <div class="post-content">{{ . }}</div>
    {{ end }}
    <ul class="page-list">
      {{ range .Sections }}
      <li>
        <a href="{{ .RelPermalink }}"><strong>{{ .LinkTitle }}</strong></a>
        <span class="muted">书</span>
      </li>
      {{ end }}
    </ul>
    <p class="muted"><a href="{{ "/posts/" | relURL }}">随笔 →</a></p>
  </div>
</main>
{{ end }}
