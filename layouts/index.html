{{ define "body-class" }}layout-simple{{ end }}
{{ define "main" }}
<main class="page-shell page-shell--simple">
  <div class="content-panel">
    <header class="content-header">
      <h1>{{ .Title }}</h1>
    </header>
    {{ with .Content }}
    <div class="post-content" data-pagefind-body>{{ . }}</div>
    {{ end }}
    <ul class="page-list">
      {{ range site.Home.Sections }}
      <li>
        <a href="{{ .RelPermalink }}"><strong>{{ .LinkTitle }}</strong></a>
      </li>
      {{ end }}
    </ul>
  </div>
</main>
{{ end }}
