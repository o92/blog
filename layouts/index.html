{{ define "body-class" }}layout-simple{{ end }}
{{ define "main" }}
{{ $books := site.GetPage "/books" }}
<main class="page-shell page-shell--simple">
  <div class="content-panel">
    <header class="content-header">
      <h1>{{ .Title }}</h1>
    </header>
    {{ with .Content }}
    <div class="post-content">{{ . }}</div>
    {{ end }}
    <ul class="page-list">
      {{ with $books }}
        {{ range .Sections }}
        <li>
          <a href="{{ .RelPermalink }}"><strong>{{ .LinkTitle }}</strong></a>
        </li>
        {{ end }}
      {{ end }}
    </ul>
  </div>
</main>
{{ end }}
