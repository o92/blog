<!DOCTYPE html>
<html
  lang="{{ or site.Language.Lang "zh-cn" }}"
  {{- if and .RawContent (in .RawContent "```mermaid") }} class="mermaid-pending"{{- end -}}
>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ with .Title }}{{ . }} | {{ end }}{{ site.Title }}{{ end }}</title>
  <script src="{{ "js/layout-widths.js" | relURL }}"></script>
  <script>
    (function () {
      try {
        var p = sessionStorage.getItem("theme-preference");
        if (p === "light" || p === "dark") {
          document.documentElement.setAttribute("data-theme", p);
        }
      } catch (e) {}
      try {
        var sb = window.innerWidth - document.documentElement.clientWidth;
        if (sb < 0) sb = 0;
        document.documentElement.style.setProperty(
          "--scrollbar-width",
          sb + "px",
        );
      } catch (e) {}
    })();
  </script>
  <style>
    /* Hide body until Mermaid finishes (class set server-side when page has diagrams). */
    html.mermaid-pending body {
      visibility: hidden;
    }
  </style>
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/glossary.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/search.css" | relURL }}">
  {{- block "head" . }}{{ end }}
</head>
<body class="{{ block "body-class" . }}{{ end }}">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-logo" href="{{ site.Home.RelPermalink }}">首页</a>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">菜单</button>
      {{ partial "nav.html" . }}
      <div class="site-header__actions">
        {{ partial "width-control.html" . }}
        {{ partial "search.html" . }}
        {{ partial "theme-toggle.html" . }}
      </div>
    </div>
  </header>
  {{- block "main" . }}{{ end }}
  <script src="{{ "js/theme.js" | relURL }}" defer></script>
  <script src="{{ "js/width.js" | relURL }}" defer></script>
  <script src="{{ "js/nav.js" | relURL }}" defer></script>
  <script src="{{ "js/glossary-tip.js" | relURL }}" defer></script>
  <script src="{{ "js/search.js" | relURL }}" defer></script>
  <script src="{{ "js/mermaid.js" | relURL }}" type="module"></script>
</body>
</html>
